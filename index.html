<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الطباعة المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4a90e2; 
            --secondary: #2ecc71; 
            --purple: #9b59b6;
            --dark: #34495e;
            --bg: #f5f7fa; 
            --text: #2c3e50; 
            --danger: #e74c3c;
            --white: #ffffff;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 8px; font-size: 18px; color: var(--dark); }
        .status-badge { display: block; text-align: center; padding: 8px; border-radius: 8px; background: #eee; margin-bottom: 15px; font-weight: bold; font-size: 14px; }
        .online { background: #d4edda; color: #155724; }
        
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box; margin-bottom: 10px; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; margin-bottom: 5px; }
        button:active { transform: scale(0.98); }
        
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--secondary); }
        .btn-purple { background: var(--purple); }
        .btn-dark { background: var(--dark); }
        .btn-red { background: var(--danger); }

        /* 🔥 تنسيق سجل الطابعات المحفوظة */
        .history-card { background: var(--white); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; }
        .history-header { background: #f8f9fa; padding: 12px 15px; font-weight: bold; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
        .printer-history-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 15px; 
            border-bottom: 1px solid #f1f1f1;
            transition: background 0.3s;
        }
        .printer-history-item:last-child { border-bottom: none; }
        .printer-history-item:hover { background: #fcfcfc; }
        .printer-info b { color: var(--dark); font-size: 15px; }
        .printer-info small { color: #888; font-size: 12px; display: block; margin-top: 2px; }
        
        .reconnect-btn { 
            width: auto !important; 
            padding: 6px 12px !important; 
            font-size: 13px !important; 
            background: var(--secondary); 
            margin-bottom: 0 !important;
        }
        .empty-history { padding: 20px; text-align: center; color: #999; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status-badge">الحالة: غير متصل ⚪</div>

    <div class="card">
        <h3>1. إعدادات الاتصال</h3>
       <div style="display: flex; gap: 10px;">
    <input type="text" id="ipInput" placeholder="IP Address (مثال: 192.168.1.200)" style="flex: 3;">
    
    <input type="number" id="portInput" placeholder="Port" value="9100" style="flex: 1;">
</div>

<button id="btnConnectWifi" class="btn-blue">ربط WiFi</button>
        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
        
        <button id="btnListBT" class="btn-purple">بحث عن أجهزة Bluetooth</button>
        <select id="btSelect">
            <option value="">اختر طابعة بلوتوث...</option>
        </select>
        <button id="btnConnectBT" class="btn-blue">ربط Bluetooth</button>
        
        <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
        
        <button id="btnConnectUsb" class="btn-dark">اتصال USB مباشر</button>
    </div>

    <div class="history-card">
        <div class="history-header">
            <span>💾 الطابعات المحفوظة</span>
        </div>
        <div id="savedPrintersList">
            <div class="empty-history">لا توجد طابعات مسجلة حالياً</div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>2. تفاصيل الفاتورة</h3>
        <p style="margin-bottom: 5px; font-size: 14px;">اسم المتجر:</p>
        <input type="text" id="storeName" placeholder="مثال: سوبر ماركت الحمد" value="سوبر ماركت البركة">

        <p style="margin-bottom: 5px; font-size: 14px;">محتوى الفاتورة:</p>
        <textarea id="invoiceContent" rows="8" placeholder="مثال:
جبنة رومي ... 50
لانشون ... 30
----------------
الإجمالي ... 80"></textarea>
    </div>

    <div class="card">
        <button id="btnPrintBill" class="btn-green" style="font-size: 20px; padding: 15px;">طـبـاعـة الـفـاتـورة 🖨️</button>
        <img id="debugPreview" style="width: 100%; border: 2px solid red; display: none; margin-top: 10px;" /> 
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
        <div class="btn-row">
            <button id="btnClear" class="btn-red">مسح الفاتورة</button>
            <button id="btnDisconnect" class="btn-dark">قطع الاتصال</button>
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
